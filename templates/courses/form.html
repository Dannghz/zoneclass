<!doctype html>

<html>

<head>
    <meta charset="UTF-8">
    <title>Nuevo / Editar Curso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/css/select2.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <center>
            <h3>
                {% if curso %}
                Editar Curso
                {% else %}
                Nuevo Curso
                {% endif %}
            </h3>
        </center>
        <div class="card shadow-sm">
            <div class="card-body">{% if error %}

                <div class="alert alert-danger">{{ error }}</div> 
                {% endif %}<form
                    action="{% if cursos %}{{ url_for('edit_course', id=curso.id) }}{% else %}{{ url_for('add_course') }}{% endif %}"
                    method="POST">
                    <div class="mb-3">
                        <label class="form-label">Título del Curso</label><input type="text" class="form-control"
                            name="titulo" placeholder="Ej: Programación en Java"
                            value="{{ curso.titulo if curso else '' }}">

                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label><textarea class="form-control" rows="3"
                            name="descripcion"
                            placeholder="Descripción del curso">{{ curso.descripcion if curso else '' }}</textarea>
                    </div>
                    <div class="mb-3"><label class="form-label">Instructor</label>

                        <select name="profesor_id" class="form-control select-profesor">{% for profesor in profesores %}

                            <option value="{{ profesor.id }}" {% if curso and curso.profesor_id==profesor.id
                                %}selected{% endif %}>{{ profesor.id }} - {{ profesor.nombre }}

                            </option>{% endfor %}

                        </select>
                    </div>
                    <div class="mb-3"><label class="form-label">Fecha de creación</label>

                        <input type="date" class="form-control" name="fecha_creacion"
                            value="{{ curso.fecha_creacion.strftime('%Y-%m-%d') if curso else '' }}">

                    </div><br>
                    <center><button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Guardar
                        </button><a href="/courses" class="btn btn-danger">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a></center>
                </form>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/js/select2.min.js"></script>
    <script>

        $(document).ready(function () {

            $('.select-profesor').select2({
                placeholder: "Buscar instructor",
                width: '100%'
            });

        });

    </script>
</body>

</html>
