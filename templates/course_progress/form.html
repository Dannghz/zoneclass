<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Formulario Lección</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='css/main.css')}}"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/css/select2.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <div class="card">
        <div class="card-header">
            <h3>
                {% if nota_lesson %}
                Editar nota
                {% else %}                                 
                Nuevo nota
                {% endif %}
            </h3>
        </div>

        <div class="card-body">
          <form
                action="{% if nota_lesson %}{{ url_for('edit_prog', id=nota_lesson.id) }}{% else %}{{ url_for('add_prog') }}{% endif %}" method="POST">
            <!-- ID Estudiante -->
            <div class="mb-3">
            <select name="usuario_id" class="form-control select-usuario">
                {% for user in users %}
                  <option value="{{ user.id }}"
                    {% if nota_lesson and nota_lesson.usuario_id == user.id %}selected{% endif %}>
                    {{ user.id }} - {{ user.nombre }}
                    </option>
                {% endfor %}
            </select>
            </div>

            <!-- ID Lección -->
            <div class="mb-3">
              <select name="curso_id" class="form-control select-curso">
                {% for leccion in lecciones %}
                    <option value="{{ leccion.id }}"
                      {% if nota_lesson and nota_lesson.curso_id == leccion.id %}selected{% endif %}>
                      {{ leccion.id }} - {{ leccion.titulo }}
                    </option>
                {% endfor %}
              </select>
            </div>

            <!-- Nota -->
            <div class="mb-3">
              <label>progreso</label>
              <input
                type="number"
                step="0.1"
                class="form-control"
                name="progreso"
                value="{{ nota_lesson.progreso if nota_lesson else '' }}"
                required
              />
            </div>

			<div class="mb-3">
              <label>Nota final</label>
              <input
                type="number"
                step="0.1"
                class="form-control"
                name="nota_final"
                value="{{ nota_lesson.nota_final if nota_lesson else '' }}"
                required
              />
            </div>

            <!-- Estado -->
            <div class="mb-3">
              <label>Estado</label>
              <select name="estado" class="form-control">
                <option
                  value="APROVADO"
                  {%
                  if
                  nota_lesson
                  and
                  nota_lesson.estado=="APROVADO"
                  %}selected{%
                  endif
                  %}
                >
                  APROVADO
                </option>

                <option
                  value="DESAPROVADO"
                  {%
                  if
                  nota_lesson
                  and
                  nota_lesson.estado=="DESAPROVADO"
                  %}selected{%
                  endif
                  %}
                >
                  DESAPROVADO
                </option>

                <option
                  value="PENDIENTE"
                  {%
                  if
                  nota_lesson
                  and
                  nota_lesson.estado=="PENDIENTE"
                  %}selected{%
                  endif
                  %}
                >
                  PENDIENTE
                </option>
              </select>
            </div>

            <!-- Fecha -->
            <div class="mb-3">
              <label>Fecha actualizacion</label>
              <input
                type="date"
                class="form-control"
                name="fecha_actualizacion"
                value="{{ nota_lesson.fecha_actualizacion.strftime('%Y-%m-%d') if nota_lesson else '' }}"
                required
              />
            </div>

            <!-- Botones -->
            <br />
            <center>
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle"></i> Guardar
              </button>
              <a href="/course_progress" class="btn btn-danger"
                ><i class="bi bi-x-circle"></i> Cancelar</a
              >
            </center>
          </form>
        </div>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/js/select2.min.js"></script>
    <script>
      $(document).ready(function () {
        $(".select-profesor").select2({
          placeholder: "Buscar instructor",
          width: "100%",
        });
      });
    </script>
  </body>
</html>
