<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Formulario Lección</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{url_for('static', filename='css/main.css')}}" />

  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/css/select2.min.css" rel="stylesheet" />
</head>

<body class="bg-light">
  <div class="container mt-5">
    <div class="card">
      <div class="card-header">
        <h3>
          {% if nota_lesson %}
          Editar nota
          {% else %}
          Nuevo nota
          {% endif %}
        </h3>
      </div>

      <div class="card-body">
        <form
          action="{% if nota_lesson %}{{ url_for('edit_regis', id=nota_lesson.id) }}{% else %}{{ url_for('add_regis') }}{% endif %}"
          method="POST">
          <!-- ID Estudiante -->
          <div class="mb-3">
            <select name="usuario_id" class="form-control select-usuario">
              {% for user in users %}
              <option value="{{ user.id }}" {% if nota_lesson and nota_lesson.usuario_id==user.id %}selected{% endif %}>
                {{ user.id }} - {{ user.nombre }}
              </option>
              {% endfor %}
            </select>
          </div>

          <!-- ID Lección -->
          <div class="mb-3">
            <select name="curso_id" class="form-control select-curso">
              {% for leccion in lecciones %}
              <option value="{{ leccion.id }}" {% if nota_lesson and nota_lesson.curso_id==leccion.id %}selected{% endif
                %}>
                {{ leccion.id }} - {{ leccion.titulo }}
              </option>
              {% endfor %}
            </select>
          </div>

          <!-- Estado -->


          <!-- Fecha -->
          <div class="mb-3">
            <label>Fecha inscripcion</label>
            <input type="date" class="form-control" name="fecha_inscripcion"
              value="{{ nota_lesson.fecha_inscripcion.strftime('%Y-%m-%d') if nota_lesson else '' }}" required />
          </div>


          <!-- Botones -->
          <br />
          <center>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-circle"></i> Guardar
            </button>
            <a href="/enrollments" class="btn btn-danger"><i class="bi bi-x-circle"></i> Cancelar</a>
          </center>
        </form>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/js/select2.min.js"></script>
  <script>
    $(document).ready(function () {
      $(".select-profesor").select2({
        placeholder: "Buscar instructor",
        width: "100%",
      });
    });
  </script>
</body>

</html>
