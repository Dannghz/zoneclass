<!doctype html>

<html>

<head>
  <meta charset="UTF-8" />
  <title>Formulario Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
</head>

<body class="bg-light">
  <div class="container mt-5">
    <div class="card">
      <div class="card-header">
        <center>
        <h3>
          Nuevo usuario
          </h3>
        </center>
      </div>

      <div class="card-body">
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('usuarios.register') }}" method="POST">
          <div class="mb-3">
            <label>Nombre:</label>
            <input type="text" class="form-control" name="nombre" value="{{ user.nombre if user else '' }}" />
          </div>

          <div class="mb-3">
            <label>Edad:</label>
            <input type="number" class="form-control" name="edad" value="{{ user.edad if user else '' }}" />
          </div>

          <div class="mb-3">
            <label>Email:</label>
            <input type="email" class="form-control" name="email" value="{{ user.email if user else '' }}" />
          </div>

          <div class="mb-3">
            <label>Intereses:</label>
            <textarea class="form-control" name="intereses">{{ user.intereses if user else '' }}</textarea>
          </div>

          <div class="mb-3">
            <label>Contraseña:</label>
            <input type="password" class="form-control" name="contrasena"
              value="{{ user.contrasena if user else '' }}" />
          </div>

    
          <div class="mb-3">
            <label>Fecha Registro:</label>
            <input type="date" class="form-control" name="fecha_registro" value="{{ user.fecha_registro.strftime('%Y-%m-%d') if user else '' }}">
          </div>

          <br />

          <center>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-circle"></i> Guardar
            </button>

            <a href="{{ url_for('login') }}" class="btn btn-danger">
              <i class="bi bi-x-circle"></i> Cancelar
            </a>
          </center>
        </form>
      </div>
    </div>
  </div>
</body>

</html>
