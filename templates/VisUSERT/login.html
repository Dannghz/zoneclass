<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>

    <div class="split-container">
        
        <div class="right-side">
            <div class="info-content">
                
                <!-- TU TÍTULO AQUÍ -->
                <h1>Bienvenido a ZoneClass</h1>
                
                <!-- TU TEXTO/PÁRRAFO AQUÍ -->
                <p>
                    Descubre una nueva forma de aprender y enseñar con ZoneClass, la plataforma educativa que conecta a 
                    estudiantes y profesores en un entorno dinámico y colaborativo. ¡Únete a nuestra comunidad y transforma tu experiencia educativa hoy mismo!
                </p>

            </div>
        </div>
     
        <div class="left-side">
            <div class="login-box">
                <h2>Iniciar Sesión</h2>
                <form action="#" method="POST">
                    
                    <div class="input-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="contrasena" placeholder="••••••••" required>
                    </div>

                    <!-- Botón de Submit -->
                    <button type="submit" class="btn-submit">Ingresar</button>
                    
                    <!-- Botón Extra que pediste -->
                    <a href="{{ url_for('register') }}" class="btn-extra">
                        Registrarse
                    </a>
                </form>
            </div>
        </div>

    </div>

</body>
</html>
