<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Formulario Lección</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{url_for('static', filename='css/main.css')}}" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/css/select2.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="card">
    <div class="card-header">
      <center>
            <h3>
                {% if curso %}
                Editar Curso
                {% else %}|                                 
                Nuevo Curso
                {% endif %}
            </h3>
        </center>
    </div>

    <div class="card-body">
      <form
                    action="{% if lesson %}{{ url_for('edit_lesson' , id=lesson.id) }}{% else %}{{ url_for('add_lesson') }}{% endif %}"
                    method="POST">

        <input type="hidden" th:field="*{id}"/>

        <!-- SELECT DE CURSOS -->
        <div class="mb-3">
          <label>Curso</label>
          <select name="curso_id" class="form-control select-curso">{% for curso_item in cursos %}

                            <option value="{{ curso_item.id }}" {% if lesson and lesson.curso_id==curso_item.id
                                %}selected{% endif %}>{{ curso_item.id }} - {{ curso_item.titulo }}

                            </option>{% endfor %}

          </select>
        </div>

        <div class="mb-3">
          <label>Título</label>
          <input type="text" class="form-control" name="titulo" value="{{ lesson.titulo if lesson else '' }}" required />
        </div>

        <div class="mb-3">
          <label>Contenido</label>
          <textarea class="form-control" name="contenido" required> {{ lesson.contenido if lesson else '' }}</textarea>
        </div>

        <div class="mb-3">
          <label>URL de Recurso</label>
          <input type="text" class="form-control" name="url_recurso" value="{{ lesson.url_recurso if lesson else '' }}" />
        </div>

        <br>
            <center>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> Guardar
                </button>
                <a href="/lessons" class="btn btn-danger"><i class="bi bi-x-circle"></i> Cancelar</a>
            </center>
      </form>
    </div>
  </div>
</div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/js/select2.min.js"></script>
    <script>

        $(document).ready(function () {

            $('.select-profesor').select2({
                placeholder: "Buscar instructor",
                width: '100%'
            });

        });

  </script>
</body>
</html>
